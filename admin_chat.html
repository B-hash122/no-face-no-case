{% extends "base.html" %}

{% block title %}Customer Chat - NO FACE NO CASE{% endblock %}

{% block extra_js %}
<script>
var socket = io();
var currentUserId = {{ current_user.id }};
var selectedUserId = null;

socket.on('connect', function() {
    socket.emit('join', {'user_id': currentUserId});
});

socket.on('receive_message', function(data) {
    if (data.sender_id == selectedUserId) {
        addMessageToChat(data.message, data.timestamp, false);
    } else {
        var userButton = document.querySelector(`[data-user-id="${data.sender_id}"]`);
        if (userButton) {
            userButton.classList.add('bg-warning');
        }
    }
});

function selectUser(userId, username, email) {
    selectedUserId = userId;
    document.getElementById('chatHeader').innerHTML = `<h5>Chatting with: ${username}</h5><small>${email}</small>`;
    document.getElementById('chatMessages').innerHTML = '';
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    
    fetch(`/admin/get-messages/${userId}`)
        .then(response => response.json())
        .then(messages => {
            messages.forEach(msg => {
                addMessageToChat(msg.message, msg.timestamp, msg.sender_id == currentUserId);
            });
        });
    
    var userButton = document.querySelector(`[data-user-id="${userId}"]`);
    if (userButton) {
        userButton.classList.remove('bg-warning');
    }
}

function sendMessage() {
    if (!selectedUserId) return;
    
    var messageInput = document.getElementById('messageInput');
    var message = messageInput.value.trim();
    
    if (message) {
        socket.emit('send_message', {
            'sender_id': currentUserId,
            'receiver_id': selectedUserId,
            'message': message
        });
        
        addMessageToChat(message, new Date().toLocaleString(), true);
        messageInput.value = '';
    }
}

function addMessageToChat(message, timestamp, isSent) {
    var messagesDiv = document.getElementById('chatMessages');
    var messageDiv = document.createElement('div');
    messageDiv.className = `message ${isSent ? 'message-sent' : 'message-received'}`;
    messageDiv.innerHTML = `
        <div><strong>${isSent ? 'You (Admin)' : 'Customer'}</strong></div>
        <div>${message}</div>
        <small class="${isSent ? 'text-light' : 'text-muted'}">${timestamp}</small>
    `;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

document.getElementById('messageInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});
</script>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5><i class="fas fa-users"></i> Customers</h5>
                </div>
                <div class="card-body" style="height: 600px; overflow-y: auto;">
                    <div class="list-group">
                        {% for user in users %}
                            <button class="list-group-item list-group-item-action" 
                                    onclick="selectUser({{ user.id }}, '{{ user.username }}', '{{ user.email }}')"
                                    data-user-id="{{ user.id }}">
                                <i class="fas fa-user-circle"></i> <strong>{{ user.username }}</strong>
                                <br><small class="text-muted">{{ user.email }}</small>
                            </button>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white" id="chatHeader">
                    <h5>Select a customer to start chatting</h5>
                </div>
                <div class="card-body">
                    <div id="chatMessages" class="chat-container mb-3"></div>
                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." disabled>
                        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
